name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          python -m pytest tests/ -v

      - name: Validate mock execution
        run: |
          python run_crucible.py --mock
          python run_crucible.py --mock --entrypoint analyze_data

      - name: Verify recorded evidence (frozen tests, grader self-test, audit records, observer ledgers)
        run: |
          python experiment/verify_all.py
